server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router uses history routing, so unknown paths must fall back to
    # index.html rather than 404 (e.g. a reload on /evaluation).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend routes. Kept in step with the proxy list in vite.config.js so the
    # same relative URLs work in development and in this image.
    location /api/      { proxy_pass http://backend:8000; }
    location /query/    { proxy_pass http://backend:8000; }
    location /upload/   { proxy_pass http://backend:8000; }
    location /documents/ { proxy_pass http://backend:8000; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Evaluation runs are long: many pipeline + judge calls per request.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
